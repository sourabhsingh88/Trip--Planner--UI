<div class="dialog-box">
  <h2 mat-dialog-title class="dialog-title">Confirm Booking</h2>
  <mat-dialog-content class="dialog-content">
    <p>Are you sure you want to book this trip?</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button class="cancel-btn" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" class="confirm-btn" (click)="confirm()">Yes, Book</button>
  </mat-dialog-actions>
</div>
